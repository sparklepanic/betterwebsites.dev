# enable our taxonomies
[taxonomies]
author = "authors"
tags = "tags"

# enable access to image metadata
[imaging.meta]
fields = ['**']

# allow html in markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
